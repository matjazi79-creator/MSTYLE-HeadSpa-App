<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M.STYLE Head Spa</title>
<style>
:root{--bg:#17372f;--panel:#f6f0e7;--gold:#c69b59;--text:#17221f;--muted:#68726e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#fff;min-height:100vh}
.wrap{max-width:980px;margin:auto;padding:20px}
header{text-align:center;margin-bottom:18px}
h1{font-family:Georgia,serif;font-size:clamp(30px,5vw,50px);margin:0;letter-spacing:.04em}
.sub{opacity:.85;margin-top:5px}
.programs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.program,button{border:0;border-radius:16px;font-weight:800;cursor:pointer}
.program{background:var(--panel);color:var(--text);padding:18px;min-height:104px;font-size:20px}
.program small{display:block;color:var(--muted);font-weight:600;margin-top:6px}
.card{background:var(--panel);color:var(--text);border-radius:24px;padding:22px;margin-top:16px}
.hidden{display:none}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.badge{background:#eadcc5;border-radius:999px;padding:10px 14px;font-weight:800}
button{padding:14px;font-size:17px}
.total{font-size:clamp(58px,13vw,100px);font-weight:900;font-variant-numeric:tabular-nums;text-align:center;line-height:1;margin:20px 0 5px}
.label{text-align:center;color:var(--muted);font-weight:800;font-size:13px;letter-spacing:.08em}
.current{margin-top:20px;border:2px solid #e6d8c3;background:#fff;border-radius:20px;padding:18px}
.current h2{font-family:Georgia,serif;font-size:clamp(27px,5vw,42px);margin:5px 0}
.stepTime{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums}
.next{margin-top:8px;color:var(--muted);font-size:18px}
.progress{height:14px;background:#e6e0d8;border-radius:999px;overflow:hidden;margin-top:14px}
.bar{height:100%;width:0;background:#2f6d56}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.start{background:#2f6d56;color:#fff}.pause{background:#e7d8bd}.nextBtn{background:var(--gold)}.stop{background:#dbcaca}
.steps{margin-top:18px}.step{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #ddd}
.step .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e8ddcc;font-weight:900}
.step.active{font-weight:900;color:#24523f}.step.done{opacity:.45}
.meta{margin-top:10px;color:var(--muted)}
@media(max-width:680px){.programs{grid-template-columns:1fr}.controls{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>M.STYLE HEAD & HAIR SPA</h1><div class="sub">Vodeni protokoli za zaposlene</div></header>
<div id="home"><div class="programs" id="programs"></div></div>
<div id="timerCard" class="card hidden">
  <div class="topline">
    <div><div id="programName" class="badge"></div><div class="meta" id="programMeta"></div></div>
    <button onclick="goHome()">← Programi</button>
  </div>
  <div class="total" id="totalClock">00:00</div>
  <div class="label">PREOSTALI ČAS PROTOKOLA</div>
  <div class="current">
    <div class="label" style="text-align:left">TRENUTNI KORAK</div>
    <h2 id="stepName">—</h2>
    <div class="stepTime" id="stepClock">00:00</div>
    <div class="next" id="nextText"></div>
    <div class="progress"><div id="bar" class="bar"></div></div>
  </div>
  <div class="controls">
    <button class="start" id="startBtn" onclick="startTimer()">▶ START</button>
    <button class="pause" id="pauseBtn" onclick="togglePause()">⏸ PAVZA</button>
    <button class="nextBtn" onclick="nextStep()">⏭ NAPREJ</button>
    <button class="stop" onclick="resetTimer()">↺ PONASTAVI</button>
    <button class="pause" onclick="gong()">🔔 TEST SPA GONG</button>
  </div>
  <div class="steps" id="stepsList"></div>
</div>
</div>
<script>
const programs=[
{name:"HEAD SPA RELAX",target:60,price:60,steps:[
["Priprava stranke",5],["Pranje las",10],["Nanos maske",3],["Masaža lasišča in vratu",9],
["Parna + svetlobna terapija",8],["Vodni ritual in izpiranje",7],["Zaključek in fen",18]]},
{name:"HEAD SPA RELAX – MOŠKI",target:40,price:45,steps:[
["Priprava stranke",5],["Pranje glave",7],["Nanos ampule / losijona",3],["Masaža lasišča in vratu",10],
["Parna + svetlobna terapija",5],["Vodni ritual in izpiranje",5],["Zaključek in fen",5]]},
{name:"SCALP & HAIR THERAPY",target:90,price:85,steps:[
["Analiza lasišča",10],["Priprava stranke",5],["Pranje in priprava",15],["Nanos maske / tonika / ampule",7],
["Masaža glave in vratu",18],["Parna + svetlobna terapija + masaža rok",10],
["Vodni ritual / izpiranje",7],["Sušenje + spihovanje",18]]},
{name:"COMPLETE HAIR RITUAL",target:120,price:110,steps:[
["Napredna analiza lasišča + spremljanje rezultata",20],["Priprava stranke",12],
["Izbira terapije + preparatov",5],["Pranje glave",13],["Maska + ampule + nega",18],
["Masaža glave, vratu in ramen",10],["Parna + svetlobna terapija + masaža rok",15],
["Vodni ritual / izpiranje",7],["Spihovanje + fen",20]]}
];
let currentIndex=0,stepIndex=0,totalLeft=0,stepLeft=0,running=false,paused=false,tick=null;
const mins=p=>p.steps.reduce((a,s)=>a+s[1],0);
function renderPrograms(){const box=document.getElementById("programs");box.innerHTML="";programs.forEach((p,i)=>{const b=document.createElement("button");b.className="program";b.innerHTML=p.name+"<small>"+p.target+" min • "+p.price+" €</small>";b.onclick=()=>openProgram(i);box.appendChild(b)})}
function openProgram(i){currentIndex=i;document.getElementById("home").classList.add("hidden");document.getElementById("timerCard").classList.remove("hidden");resetTimer()}
function goHome(){if(tick)clearInterval(tick);running=false;document.getElementById("timerCard").classList.add("hidden");document.getElementById("home").classList.remove("hidden")}
function fmt(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function resetTimer(){if(tick)clearInterval(tick);running=false;paused=false;stepIndex=0;const p=programs[currentIndex];totalLeft=mins(p)*60;stepLeft=p.steps[0][1]*60;document.getElementById("programName").textContent=p.name;document.getElementById("programMeta").textContent=p.target+" min • "+p.price+" €";document.getElementById("startBtn").textContent="▶ START";document.getElementById("pauseBtn").textContent="⏸ PAVZA";updateUI()}
function updateUI(){const p=programs[currentIndex],s=p.steps[stepIndex];document.getElementById("totalClock").textContent=fmt(totalLeft);document.getElementById("stepClock").textContent=fmt(stepLeft);document.getElementById("stepName").textContent=s?s[0]:"KONEC";const n=p.steps[stepIndex+1];document.getElementById("nextText").textContent=n?"Naslednje: "+n[0]+" • "+n[1]+" min":"Zadnji korak";const full=s?s[1]*60:1;document.getElementById("bar").style.width=Math.min(100,Math.max(0,100-stepLeft/full*100))+"%";const list=document.getElementById("stepsList");list.innerHTML="";p.steps.forEach((x,i)=>{const d=document.createElement("div");d.className="step"+(i===stepIndex?" active":i<stepIndex?" done":"");d.innerHTML='<span class="num">'+(i+1)+'</span><span>'+x[0]+'</span><strong>'+x[1]+' min</strong>';list.appendChild(d)})}
function gong(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),now=ctx.currentTime,master=ctx.createGain();master.gain.setValueAtTime(.0001,now);master.gain.exponentialRampToValueAtTime(.085,now+.035);master.gain.exponentialRampToValueAtTime(.0001,now+4.2);master.connect(ctx.destination);[{f:261.63,g:.42,d:4},{f:392,g:.18,d:3.4},{f:523.25,g:.10,d:2.8},{f:784,g:.035,d:1.9}].forEach((t,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=t.f;o.detune.value=(i-1.5)*2.5;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(t.g,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+t.d);o.connect(g);g.connect(master);o.start(now);o.stop(now+t.d+.05)});setTimeout(()=>ctx.close(),4600)}catch(e){}}
function startTimer(){if(running&&!paused)return;if(paused){paused=false;document.getElementById("pauseBtn").textContent="⏸ PAVZA";return}running=true;paused=false;document.getElementById("startBtn").textContent="▶ TEČE";tick=setInterval(()=>{if(paused)return;totalLeft--;stepLeft--;if(stepLeft<=0){stepIndex++;if(stepIndex>=programs[currentIndex].steps.length){clearInterval(tick);running=false;totalLeft=0;stepLeft=0;gong();updateUI();return}stepLeft=programs[currentIndex].steps[stepIndex][1]*60;gong()}updateUI()},1000)}
function togglePause(){if(!running)return;paused=!paused;document.getElementById("pauseBtn").textContent=paused?"▶ NADALJUJ":"⏸ PAVZA"}
function nextStep(){const p=programs[currentIndex];if(stepIndex<p.steps.length-1){totalLeft-=stepLeft;stepIndex++;stepLeft=p.steps[stepIndex][1]*60;gong();updateUI()}}
renderPrograms();
</script>
</body>
</html>
