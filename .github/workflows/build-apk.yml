name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MSTYLE-Head-Spa.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSTYLE-SPA-APK
          path: MSTYLE-Head-Spa.apk

      - name: Publish permanent latest release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: M.STYLE Head Spa - Latest
          body: "Najnovejša namestitvena datoteka za Android tablico."
          artifacts: "MSTYLE-Head-Spa.apk"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          artifactErrorsFailBuild: true
